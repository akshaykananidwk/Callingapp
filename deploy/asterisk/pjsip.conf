; CallBridge PBX — generated by deploy/pbx-install.sh
[global]
type=global
user_agent=CallBridge PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0

; ---- GoIP GSM gateway (registers to us over the internet) ----
[goip]
type=endpoint
context=from-goip
disallow=all
allow=ulaw,alaw
auth=goip-auth
aors=goip
identify_by=auth_username,username
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
send_rpid=yes
trust_id_inbound=yes

[goip-auth]
type=auth
auth_type=userpass
username=goip
password=__GOIP_PASSWORD__

[goip]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---- Website softphone (WebRTC, all browser tabs register here) ----
[webrtc]
type=endpoint
context=from-webrtc
disallow=all
allow=ulaw,alaw
auth=webrtc-auth
aors=webrtc
webrtc=yes
dtls_auto_generate_cert=yes
direct_media=no

[webrtc-auth]
type=auth
auth_type=userpass
username=webrtc
password=__WEB_PASSWORD__

[webrtc]
type=aor
max_contacts=5
remove_existing=yes
qualify_frequency=0
