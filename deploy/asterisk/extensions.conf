; CallBridge PBX dialplan — generated by deploy/pbx-install.sh
[general]
static=yes
writeprotect=yes

[globals]
CB_URL=http://127.0.0.1:__APP_PORT__/pbx
CB_SECRET=__PBX_SECRET__
CB_LIVE=__LIVE_DIR__
CB_SOUNDS=__SOUNDS_DIR__

; ---- Calls arriving from the GSM gateway ----
[from-goip]
exten => s,1,Goto(cb-incoming,s,1)
exten => _[0-9a-zA-Z+*#].,1,Goto(cb-incoming,s,1)

[cb-incoming]
exten => s,1,NoOp(CallBridge incoming call from ${CALLERID(num)})
 same => n,Set(CB_UID=${UNIQUEID})
 same => n,Set(CB_RESP=${CURL(${CB_URL}/event?secret=${CB_SECRET}&type=incoming&uid=${CB_UID}&number=${URIENCODE(${CALLERID(num)})})})
 same => n,Set(CB_MODE=${CUT(CB_RESP,|,1)})
 same => n,Set(CB_SECS=${CUT(CB_RESP,|,2)})
 same => n,ExecIf($["${CB_SECS}" = ""]?Set(CB_SECS=20))
 same => n,Set(CHANNEL(hangup_handler_push)=cb-hangup,s,1(${CB_UID}))
 same => n,GotoIf($["${CB_MODE}" = "demo"]?demo)
 same => n,Set(CB_DEST=${PJSIP_DIAL_CONTACTS(webrtc)})
 same => n,GotoIf($["${CB_DEST}" = ""]?noagent)
 same => n,Dial(${CB_DEST},${CB_SECS},U(cb-answered^${CB_UID}))
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(noagent),GotoIf($["${CB_MODE}" = "ring_then_demo"]?demo)
 same => n(done),Hangup()
 same => n(demo),Answer()
 same => n,Set(CB_X=${CURL(${CB_URL}/event?secret=${CB_SECRET}&type=answered&uid=${CB_UID}&by=demo)})
 same => n,MixMonitor(${CB_LIVE}/${CB_UID}.sln16)
 same => n,Wait(1)
 same => n(loop),Playback(${IF(${STAT(e,${CB_SOUNDS}/demo.sln16)}?${CB_SOUNDS}/demo:hello-world)})
 same => n,Wait(1)
 same => n,Goto(loop)

; ---- Calls dialled from the website ----
[from-webrtc]
exten => _[+0-9*#].,1,NoOp(CallBridge outgoing call to ${EXTEN})
 same => n,Set(CB_UID=${UNIQUEID})
 same => n,Set(CB_X=${CURL(${CB_URL}/event?secret=${CB_SECRET}&type=outgoing&uid=${CB_UID}&number=${URIENCODE(${EXTEN})})})
 same => n,Set(CHANNEL(hangup_handler_push)=cb-hangup,s,1(${CB_UID}))
 same => n,Dial(PJSIP/${EXTEN}@goip,90,b(cb-predial^s^1(${EXTEN}))U(cb-answered^${CB_UID}))
 same => n,Hangup()

; ---- Helpers ----
; Runs on the outgoing gateway channel before dialling. Android gsm2sip dials the number in
; X-GSM-Forward (international format); GoIP / HT813 simply ignore the header.
[cb-predial]
exten => s,1,Set(CB_N=${ARG1})
 same => n,GotoIf($[${REGEX("^[0-9]+$" ${CB_N})} = 0]?send)
 same => n,ExecIf($["${CB_N:0:1}" = "0"]?Set(CB_N=${CB_N:1}))
 same => n,ExecIf($[${LEN(${CB_N})} = 10]?Set(CB_N=91${CB_N}))
 same => n,Set(CB_N=+${CB_N})
 same => n(send),Set(PJSIP_HEADER(add,X-GSM-Forward)=${CB_N})
 same => n,Return()

; Runs on the answering channel: start the two-way recording and tell the website.
[cb-answered]
exten => s,1,MixMonitor(${CB_LIVE}/${ARG1}.sln16)
 same => n,Set(CB_X=${CURL(${CB_URL}/event?secret=${CB_SECRET}&type=answered&uid=${ARG1})})
 same => n,Return()

[cb-hangup]
exten => s,1,Set(CB_X=${CURL(${CB_URL}/event?secret=${CB_SECRET}&type=end&uid=${ARG1}&billsec=${CDR(billsec)}&cause=${HANGUPCAUSE}&status=${DIALSTATUS})})
 same => n,Return()
